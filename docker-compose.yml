services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: desfudencify
      POSTGRES_USER: desfudencify
      POSTGRES_PASSWORD: desfudencify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desfudencify -d desfudencify"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=desfudencify;Username=desfudencify;Password=desfudencify
      Jwt__Key: DesfudenciFy_Docker_Secret_Key_Change_Me_32chars!
      Jwt__Issuer: DesfudenciFy
      Jwt__Audience: DesfudenciFy
      Jwt__ExpiresHours: "12"
      Seed__AdminEmail: admin@desfudencify.local
      Seed__AdminPassword: Admin@12345
      Seed__AdminFullName: Administrator
      Storage__RootPath: /app/data/uploads
    volumes:
      - ./data/uploads:/app/data/uploads
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
