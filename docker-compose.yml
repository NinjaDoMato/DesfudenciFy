services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desfudencify}
      POSTGRES_USER: ${POSTGRES_USER:-desfudencify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desfudencify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Postgres stays internal to the Docker network (not exposed on the LAN).

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-desfudencify};Username=${POSTGRES_USER:-desfudencify};Password=${POSTGRES_PASSWORD:-desfudencify}
      Jwt__Key: ${JWT_KEY:-DesfudenciFy_Docker_Secret_Key_Change_Me_32chars!}
      Jwt__Issuer: ${JWT_ISSUER:-DesfudenciFy}
      Jwt__Audience: ${JWT_AUDIENCE:-DesfudenciFy}
      Jwt__ExpiresHours: ${JWT_EXPIRES_HOURS:-12}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@desfudencify.local}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      Seed__AdminFullName: ${SEED_ADMIN_FULL_NAME:-Administrator}
      Storage__RootPath: /app/data/uploads
    volumes:
      - ./data/uploads:/app/data/uploads
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
